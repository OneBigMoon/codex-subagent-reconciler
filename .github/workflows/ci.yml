name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s skills/reconcile-codex-subagents/tests -v
      - run: PYTHONDONTWRITEBYTECODE=1 python3 skills/reconcile-codex-subagents/scripts/doctor.py --help
      - run: PYTHONDONTWRITEBYTECODE=1 python3 skills/reconcile-codex-subagents/scripts/postflight.py --help
