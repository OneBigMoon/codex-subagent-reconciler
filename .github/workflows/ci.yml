              ).returncode == 0, primary_ref
              assert subprocess.check_output(
                  ['git', 'rev-list', '--count', f'{primary_ref}..HEAD'],
                  text=True,
              ).strip() == '1', primary_ref
          for path, text in readme_texts.items():
              bare_placeholders = re.findall(r'(?<!OLD_)(?<!NEW_)AUDITED_COMMIT_SHA', text)
              installer_refs = re.findall(
                  r'(?m)^\s*--ref (AUDITED_COMMIT_SHA|[0-9a-f]{40}) \\$',
                  text,
                  re.I,
              )
              comment_refs = re.findall(
                  r'(?m)^\s*#.*?--ref\s+(AUDITED_COMMIT_SHA|[0-9a-f]{40})(?:\s|$)',
                  text,
                  re.I,
              )
              assert installer_refs, path
              if comment_refs:
                  assert {item.lower() for item in comment_refs} <= {primary_ref}, path
              if primary_ref == 'audited_commit_sha':
                  assert bare_placeholders, path
              else:
                  assert not bare_placeholders, path
                  assert {item.lower() for item in installer_refs} == {primary_ref}, path
          if re.fullmatch(r'[0-9a-f]{40}', primary_ref, re.I):
              placeholder_bytes = re.compile(
                  rb'(?<!OLD_)(?<!NEW_)AUDITED_COMMIT_SHA',
                  re.I,
              )
              for path in readmes:
                  relative = str(path.relative_to(root))
                  source = subprocess.check_output(
                      ['git', 'show', f'{primary_ref}:{relative}'],
                  )
                  expected = placeholder_bytes.sub(primary_ref.encode(), source)
                  assert expected == path.read_bytes(), path
              changed_paths = subprocess.check_output(
                  ['git', 'diff', '--name-only', '--no-renames', f'{primary_ref}..HEAD'],
                  text=True,
              ).splitlines()
              expected_paths = sorted(str(path.relative_to(root)) for path in readmes)
              assert sorted(changed_paths) == expected_paths, (
                  changed_paths,
                  expected_paths,
              )
          for path, text in readme_texts.items():
              assert all(token in text for token in required), path
              for token in (
                  'bundled-with-guardian-plugin',
                  'automatic-after-explicit-setup-apply',
                  'detect-then-separately-authorize',
                  'account-dependent',
                  'mcp_servers: []',
                  'author-lite',
              ):
                  assert token in text, (path, token)
              assert 'github-marketplace-account' not in text, path
              assert 'codex-workflow-guardian/bootstrap-stdout/v1' in text, path
              assert '$setup-codex-workflow-guardian' in text, path
              assert 'Plugin' in text and 'receipt' in text, path
              assert 'GUARDIAN_SAFE_PATH="/usr/bin:/bin:/usr/sbin:/sbin"' in text, path
              assert '/usr/bin/mktemp' in text, path
              assert 'Mach-O' in text, path
              assert 'UNINSTALL_RECEIPT_JSON' in text, path
              assert 'XXXXXX.' not in text, path
              assert '${TMPDIR' not in text, path
              assert 'PLUGIN_BASELINE_JSON="/absolute/path' not in text, path
              assert 'arbitrary source checkout' not in text, path
              assert 'installed or copied directory' not in text, path
              assert 'copied root' not in text, path
              assert 'AUDITED_COMMIT_SHA' in text, path
              assert '/usr/bin/env CODEX_HOME=' not in text, path
              assert re.search(r'(?<!/usr/bin/)mktemp', text) is None, path
              for env_line in text.splitlines():
                  if '/usr/bin/env ' in env_line:
                      assert 'PATH="$GUARDIAN_SAFE_PATH" CODEX_HOME=' in env_line, (path, env_line)
              for block in re.findall(r'```sh\n(.*?)```', text, flags=re.S):
                  lines = block.splitlines()
                  for index, line in enumerate(lines):
                      match = re.match(r'^([A-Z][A-Z0-9_]*)="\$\(/usr/bin/mktemp ', line)
                      if match:
                          assert index + 1 < len(lines), (path, line)
                          assert lines[index + 1].startswith(f'test -n "${match.group(1)}"'), (path, line)
          non_darwin_markers = {
              'README.md': ('non-Darwin', 'no OS installation gate'),
              'README.zh-CN.md': ('非 Darwin', 'OS 安装门'),
              'README.ja.md': ('非 Darwin', 'OS インストールゲート'),
              'README.es.md': ('no Darwin', 'barrera de instalación por sistema operativo'),
          }
          for path, markers in non_darwin_markers.items():
              assert all(marker in readme_texts[root / path] for marker in markers), path
          def command_blocks(text):
              blocks = re.findall(r'```sh\n(.*?)```', text, flags=re.S)
              normalized = []
              for block in blocks:
                  lines = []
                  for line in block.splitlines():
                      line = re.sub(r'\s+#.*$', '', line).strip()
                      if line and not line.startswith('#'):
                          lines.append(line)
                  normalized.append(lines)
              return normalized
          command_shapes = {path: command_blocks(text) for path, text in readme_texts.items()}
          assert len({repr(value) for value in command_shapes.values()}) == 1, (
              'four-language README shell command drift',
              {str(path): value for path, value in command_shapes.items()},
          )
          security_contract_tokens = (
              'canonical absolute',
              'OpenAI Developer ID',
              'JS launcher',
              'private-local',
              'public-redacted',
              'admin group-write',
              'extended ACL',
              'same-UID',
              'GUARDIAN_CODEX_BIN="/absolute/path/to/trusted/native-codex"',
              '/opt/homebrew/bin/codex',
              '/usr/local/bin/codex',
              'Mach-O',
              'CODEX_HOST_ARCH',
              'codesign --verify --strict --requirements',
              'identifier "codex"',
              '2DC432GLL2',
              '0700', '0750', '0755', '0600',
              'GUARDIAN_GIT_BIN="/usr/bin/git"',
              'PYTHON_BIN="/absolute/path/to/trusted/python3.11"',
          )
          for path, text in readme_texts.items():
              assert all(token in text for token in security_contract_tokens), path
              for block in re.findall(r'```sh\n(.*?)```', text, flags=re.S):
                  syntax = subprocess.run(
                      ['/bin/sh', '-n'],
                      input=block,
                      text=True,
                      capture_output=True,
                      check=False,
                  )
                  assert syntax.returncode == 0, (path, syntax.stderr)
                  assert 'command -v codex' not in block
                  assert 'command -v git' not in block
                  assert re.search(r'(?m)^\s*python3(?:\s|$)', block) is None
          setup_skill = (root / 'skills/setup-codex-workflow-guardian/SKILL.md').read_text()
          setup_contract = ' '.join(setup_skill.split())
          for token in (
              'installed-but-unowned',
              'it never grants Plugin ownership',
              'rollback authority',
              '`--uninstall` deletion authority',
              'Plugin removal requires a separate explicit user decision',
          ):
              assert token in setup_contract, token
          assert 'acceptance_level' in setup_contract
          assert 'preflight|installed|uninstalled|transaction-recovery' in setup_contract
          for obsolete in (
              'receipt-owned only when this Setup run added it',
              'recorded as owned and can be removed by its receipt',
          ):
              assert obsolete not in setup_contract, obsolete
          bootstrap_source = (root / 'skills/setup-codex-workflow-guardian/scripts/bootstrap_macos.py').read_text()
          bootstrap_tree = ast.parse(bootstrap_source)
          assert 'installed but unowned' in bootstrap_source
          assert 'legacy plugin ownership was discarded' in bootstrap_source
          assert not any(
              isinstance(node, ast.Call)
              and isinstance(node.func, ast.Name)
              and node.func.id == '_plugin_remove'
              for node in ast.walk(bootstrap_tree)
          ), 'Setup must never issue automatic Plugin removal'
          reconciler_skill = (root / 'skills/reconcile-codex-subagents/SKILL.md').read_text()
          assert 'installedPath' in setup_skill
          assert 'same trusted root' in setup_skill
          for skill_text in (setup_skill, reconciler_skill):
              assert 'codex-workflow-guardian/bootstrap-stdout/v1' in setup_skill
              assert 'clean tracked checkout' in skill_text
              assert 'doctor' in skill_text and 'postflight' in skill_text
              assert 'arbitrary source checkout' not in skill_text
              assert 'installed or copied directory' not in skill_text
          assert 'unsupported-event' in reconciler_skill
          assert 'strict v2 rejects unknown' in reconciler_skill.lower()
          assert 'default_prompt:' in (root / 'skills/setup-codex-workflow-guardian/agents/openai.yaml').read_text()
          assert len((root / 'skills/setup-codex-workflow-guardian/agents/openai.yaml').read_text().split('default_prompt:', 1)[1].split('policy:', 1)[0].strip()) < 160
          guardian = (root / 'skills/codex-workflow-guardian/SKILL.md').read_text()
          for token in (
              'bounded intake', 'TaskGraph fingerprint',
              'shared host-slot budget', 'Sol frames requirements',
              'Spark', 'Luna', 'independent verifier', 'typed handoff',
              'compact', 'just-in-time', 'source', 'installed', 'capability',
              'live', 'PROTOCOL_INTEGRITY_FAILURE', 'Durable Store',
              'intent_id', 'canonical absolute', '--db',
              'installation-ready', 'capability-configured-unverified',
              'acceptance-installed', 'non-secret', 'goal_identity',
              '<artifact-ref>', '<pii-ref>', 'authorized full `RunIntent`',
              'HostAdapter', 'codex_app__create_thread', 'lane-direct',
              'ACTION_RELAY_REQUIRED', 'configured-unverified',
          ):
              assert token in guardian, token

          def is_ignored(path):
              result = subprocess.run(
                  ['git', 'check-ignore', '--no-index', '-q', '--', path],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,
                  check=False,
              )
              assert result.returncode in (0, 1), result.stderr.decode('utf-8', 'replace')
              return result.returncode == 0

          allowed_release_paths = {
              '.gitignore',
              'workflow-dependencies.lock.json',
              'config.lock.json',
              'docs/runtime.md',
              'docs/receipt-guide.md',
              'skills/setup-codex-workflow-guardian/scripts/bootstrap_macos.py',
          }
          denied_local_paths = {
              'runtime.db',
              'runtime.db-shm',
              'runtime.db-wal',
              'nested/allinluna-runtime.db',
              'nested/allinluna-runtime.db-wal',
              'nested/fixture.db-shm',
              'workflow-guardian/bootstrap-receipt.json',
              'workflow-guardian/bootstrap-receipt.sha256',
              'workflow-guardian/bootstrap-journal.json',
              'workflow-guardian/bootstrap.lock',
              'runtime.receipt.json',
              'runtime.journal.json',
              'runtime.lock',
              'store.lock',
              'venvs/.guardian-venv-allinluna',
              'agents/.guardian-copy-abc',
              'guardian-install.json',
          }
          assert not {path for path in allowed_release_paths if is_ignored(path)}, (
              'legal source path is ignored',
              sorted(path for path in allowed_release_paths if is_ignored(path)),
          )
          assert {path for path in denied_local_paths if not is_ignored(path)} == set(), (
              'local artifact path is not ignored',
              sorted(path for path in denied_local_paths if not is_ignored(path)),
          )
          tracked_paths = [
              raw.decode('utf-8')
              for raw in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
              if raw
          ]
          tracked_ignored = sorted(path for path in tracked_paths if is_ignored(path))
          assert not tracked_ignored, (
              'tracked release path matches a local-artifact ignore rule; remove it',
              tracked_ignored,
          )
          secret_markers = (
              b'-----BEGIN PRIVATE KEY-----',
              b'-----BEGIN OPENSSH PRIVATE KEY-----',
              b'ghp_',
              b'github_pat_',
              b'xoxb-',
              b'sk-live-',
          )
          for relative in tracked_paths:
              if relative == '.github/workflows/ci.yml':
                  continue
              path = root / relative
              if not path.is_file():
                  continue
              payload = path.read_bytes()
              assert not any(marker in payload for marker in secret_markers), relative
          PY
      - run: |
          if find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit | grep -q .; then
            echo "bytecode artifacts found"
            exit 1
          fi
      - run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  non-darwin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Keep help available on non-Darwin
        run: |
          set -eu
          PYTHONDONTWRITEBYTECODE=1 python3 -B skills/reconcile-codex-subagents/scripts/doctor.py --help >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 -B skills/reconcile-codex-subagents/scripts/postflight.py --help >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 -B skills/setup-codex-workflow-guardian/scripts/bootstrap_macos.py --help >/dev/null
      - name: Prove non-Darwin calls fail closed without sentinel access
        run: |
          set -eu
          PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          import hashlib
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          python = sys.executable
          doctor = root / 'skills/reconcile-codex-subagents/scripts/doctor.py'
          postflight = root / 'skills/reconcile-codex-subagents/scripts/postflight.py'
          setup = root / 'skills/setup-codex-workflow-guardian/scripts/bootstrap_macos.py'

          def invoke(label, args, markers):
              result = subprocess.run(
                  [python, '-I', '-B', *map(str, args)],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              output = result.stdout + result.stderr
              assert result.returncode == 2, (label, result.returncode)
              assert any(marker in output for marker in markers), (label, output)

          def fingerprint(path):
              stat = path.stat()
              content = path.read_bytes()
              return (content, hashlib.sha256(content).hexdigest(), stat.st_mtime_ns)

          with tempfile.TemporaryDirectory(prefix='codex-nondarwin-') as directory:
              temp = Path(directory)
              sentinel = temp / 'unreadable-sentinel.json'
              sentinel.write_bytes(b'codex-non-darwin-sentinel\n')
              before = fingerprint(sentinel)
              os.chmod(sentinel, 0)
              missing = temp / 'missing-sentinel.json'
              missing_home = temp / 'missing-codex-home'

              invoke('doctor unreadable', [doctor, '--input', sentinel, '--json'], ('unsupported-platform',))
              invoke('doctor missing', [doctor, '--input', missing, '--json'], ('unsupported-platform',))
              invoke(
                  'postflight unreadable',
                  [postflight, '--before', sentinel, '--after', sentinel, '--record-key', 'record-1', '--json'],
                  ('unsupported-platform',),
              )
              invoke(
                  'postflight missing',
                  [postflight, '--before', missing, '--after', missing, '--record-key', 'record-1', '--json'],
                  ('unsupported-platform',),
              )
              invoke(
                  'setup unreadable',
                  [setup, '--check', '--codex-home', sentinel, '--codex-bin', sentinel, '--git-bin', sentinel],
                  ('platform-unavailable', 'macOS is required'),
              )
              invoke(
                  'setup missing',
                  [setup, '--check', '--codex-home', missing_home, '--codex-bin', missing, '--git-bin', missing],
                  ('platform-unavailable', 'macOS is required'),
              )

              os.chmod(sentinel, 0o600)
              assert fingerprint(sentinel) == before, 'unsupported host touched sentinel'
              assert not missing.exists(), 'unsupported host created missing sentinel'
              assert not missing_home.exists(), 'unsupported host created missing CODEX_HOME'
          PY
