          for path, markers in readme_semantics.items():
              compact = normalized_readmes[path]
              assert all(marker in compact for marker in markers), path
              assert readme_texts[path].count('POST_GUARDIAN_REMOVE_PLUGIN_LIST_JSON="$(/usr/bin/mktemp') == 3, path
              assert readme_texts[path].count('plugin marketplace remove') == 3, path
          import re
          import subprocess
          guardian_refs = {}
          for path, text in readme_texts.items():
              refs = re.findall(
                  r'(?m)^GUARDIAN_REF="(AUDITED_COMMIT_SHA|[0-9a-f]{40})"(?:\s+#.*)?$',
                  text,
                  re.I,
              )
              assert refs, path
              assert len(set(refs)) == 1, (path, refs)
              guardian_refs[path] = refs[0].lower()
          assert len(set(guardian_refs.values())) == 1, guardian_refs
          primary_ref = next(iter(guardian_refs.values()))
          if re.fullmatch(r'[0-9a-f]{40}', primary_ref, re.I):
              assert subprocess.run(
                  ['git', 'cat-file', '-e', f'{primary_ref}^{{commit}}'],
                  check=False,
              ).returncode == 0, primary_ref
              assert subprocess.run(
                  ['git', 'merge-base', '--is-ancestor', primary_ref, 'HEAD'],
